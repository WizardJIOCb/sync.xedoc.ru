services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: wizard-sync
    restart: "no"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Yekaterinburg}
    ports:
      - "${SYNC_GUI_BIND:-127.0.0.1:8384}:8384"
      - "${SYNC_PORT_TCP:-22000}:22000/tcp"
      - "${SYNC_PORT_UDP:-22000}:22000/udp"
      - "${DISCOVERY_PORT_UDP:-21027}:21027/udp"
    volumes:
      - ./runtime/syncthing-config:/config
      - ./runtime/vault:/data/vault
